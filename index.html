<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>brunosoares.net</title>
<meta name="description" content="brunosoares.net">
<meta name="theme-color" content="#000000">
<meta property="og:type" content="website">
<meta property="og:title" content="brunosoares.net">
<meta property="og:description" content="You've arrived.">
<meta property="og:url" content="https://brunosoares.net/">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://brunosoares.net/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --ink:#e8e4dc; --muted:rgba(232,228,220,.42); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; min-height:100svh; background:#000; overflow:hidden; }
  body {
    font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    color:var(--ink);
  }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0; pointer-events:none; }
  .terminal {
    position:fixed; z-index:2;
    left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(520px, 86vw);
    min-height:1.5em;
    display:flex; flex-direction:column; align-items:flex-start;
    font-size:13.5px; line-height:1.55;
    text-shadow:0 0 12px rgba(232,228,220,.10);
  }
  .lines { display:flex; flex-direction:column; gap:3px; max-width:100%; }
  .row { white-space:pre-wrap; word-break:break-word; color:var(--muted); }
  .row.echo { color:rgba(232,228,220,.82); }
  .inputline { display:flex; align-items:baseline; gap:8px; white-space:pre; color:rgba(232,228,220,.92); }
  .prompt { flex:0 0 auto; }
  .cmd { white-space:pre; }
  .cursor { display:inline-block; width:8px; height:1.05em; background:rgba(232,228,220,.88); transform:translateY(2px); animation:blink 1.08s steps(1,end) infinite; }
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  .hidden-input {
    position:fixed; inset:0; width:100%; height:100%; opacity:0;
    border:0; padding:0; margin:0; background:transparent; color:transparent;
    caret-color:transparent; font-size:1px;
  }
  @media (max-width:600px) {
    .terminal { width:82vw; font-size:13px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="terminal" id="terminal" aria-hidden="true">
  <div class="lines" id="lines"></div>
  <div class="inputline"><span class="prompt">&gt;</span><span class="cmd" id="cmdText"></span><span class="cursor"></span></div>
</div>
<input id="cmd" class="hidden-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="terminal command">
<script>
(() => {
  'use strict';

  const cv=document.getElementById('c'), ctx=cv.getContext('2d',{alpha:false});
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w=0,h=0,dpr=1,pts=[];
  let speed=0.34, palette='bone', bgRGB='0,0,0';
  let mode='flow', prevMode='flow', modeT=1, lastModeShift=performance.now();
  let mx=-9999,my=-9999,bursts=[],animationFrame=null;
  const started=performance.now();
  const MODES=['flow','rain','orbit','wave','swarm'];
  const MODE_INTERVAL=52000;
  const PALETTES={
    bone:{ bg:[0,0,0], cols:['#e8e4dc','#d8d2c6','#f1ede4'], hi:'#fff8ea' },
    ash:{ bg:[0,0,0], cols:['#d7dbdf','#aeb5bc','#eef0f4'], hi:'#f8f7ff' }
  };

  function hexRGB(hex){ const n=parseInt(hex.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
  function assignColors(){
    const p=PALETTES[palette]; bgRGB=p.bg.join(',');
    const cols=p.cols.map(hexRGB), hi=hexRGB(p.hi);
    for(const dot of pts){
      const c=Math.random()<0.08?hi:cols[(Math.random()*cols.length)|0];
      const a=Math.random()<0.08?0.58:0.20+Math.random()*0.20;
      dot.col=`rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)})`;
    }
    ctx.fillStyle='rgb(0,0,0)'; ctx.fillRect(0,0,w,h);
  }
  function size(){
    dpr=Math.min(devicePixelRatio||1,2);
    w=cv.width=Math.floor(innerWidth*dpr); h=cv.height=Math.floor(innerHeight*dpr);
    cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
    ctx.fillStyle='rgb(0,0,0)'; ctx.fillRect(0,0,w,h);
  }
  function init(){
    const n=Math.max(420, Math.min(1400, Math.floor((w*h)/820)));
    pts=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,life:(140+Math.random()*260)|0,col:'rgba(232,228,220,.30)'}));
    assignColors();
  }
  function flow(x,y,t){ return (Math.sin(x*0.0016+t*0.2)+Math.cos(y*0.0016-t*0.15)+Math.sin((x+y)*0.0011+t*0.1))*Math.PI; }
  function fieldAngle(m,x,y,t){
    if(m==='flow') return flow(x,y,t);
    if(m==='rain') return Math.PI/2 + Math.sin(x*0.010 + t*1.5)*0.10;
    const dx=x-w/2, dy=y-h/2, ang=Math.atan2(dy,dx);
    if(m==='orbit') return ang+Math.PI/2;
    if(m==='wave'){ const ty=h/2 + Math.sin(x*0.012 + t*1.2)*h*0.28; return Math.atan2(ty-y,50*dpr); }
    if(m==='swarm'){ const ax=w/2+Math.cos(t*0.5)*w*0.3, ay=h/2+Math.sin(t*0.7)*h*0.3; return Math.atan2(ay-y,ax-x)+Math.PI/2; }
    return flow(x,y,t);
  }
  function lerpAngle(a,b,t){ let d=b-a; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2; return a+d*t; }
  function setMode(next){
    if(!MODES.includes(next) || next===mode) return false;
    prevMode=mode; mode=next; modeT=0; lastModeShift=performance.now(); return true;
  }
  function cycleMode(){ const i=MODES.indexOf(mode); setMode(MODES[(i+1)%MODES.length]); }
  function renderStatic(){
    const tt=0;
    for(const p of pts){
      const a=fieldAngle('flow',p.x,p.y,tt), step=1.1*dpr;
      ctx.strokeStyle=p.col.replace(/,([0-9.]+)\)$/,(m,a)=>','+(Number(a)*0.58).toFixed(3)+')');
      ctx.lineWidth=0.95*dpr;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+Math.cos(a)*step,p.y+Math.sin(a)*step); ctx.stroke();
    }
  }
  function frame(t){
    if(!reduce && t-lastModeShift>MODE_INTERVAL) cycleMode();
    const age=Math.max(0,(t-started)/1000);
    const fade=Math.min(1, age/5.5);
    ctx.fillStyle='rgba(0,0,0,0.082)'; ctx.fillRect(0,0,w,h);
    const tt=t*0.001;
    if(modeT<1) modeT=Math.min(1,modeT+0.010);
    for(const p of pts){
      const a=lerpAngle(fieldAngle(prevMode,p.x,p.y,tt),fieldAngle(mode,p.x,p.y,tt),modeT);
      let vx=Math.cos(a), vy=Math.sin(a);
      for(const b of bursts){
        const ageB=(t-b.t0)/1000, br=ageB*640*dpr, dx=p.x-b.x, dy=p.y-b.y, d=Math.hypot(dx,dy)||1, band=Math.abs(d-br);
        if(band<42*dpr){ const f=(1-band/(42*dpr))*3.2; vx+=dx/d*f; vy+=dy/d*f; }
      }
      if(mx>-1000){
        const dx=mx-p.x, dy=my-p.y, d=Math.hypot(dx,dy)||1, r=155*dpr;
        if(d<r){ const f=(1-d/r)*0.045; vx+=dx/d*f; vy+=dy/d*f; }
      }
      const step=1.45*dpr*speed;
      const nx=p.x+vx*step, ny=p.y+vy*step;
      ctx.strokeStyle=p.col.replace(/,([0-9.]+)\)$/,(m,a)=>','+(Number(a)*fade).toFixed(3)+')');
      ctx.lineWidth=0.95*dpr;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(nx,ny); ctx.stroke();
      p.x=nx; p.y=ny; p.life--;
      if(p.life<0 || p.x<0 || p.x>w || p.y<0 || p.y>h){ p.x=Math.random()*w; p.y=Math.random()*h; p.life=(160+Math.random()*280)|0; }
    }
    bursts=bursts.filter(b=>(t-b.t0)/1000<1.15);
    animationFrame=requestAnimationFrame(frame);
  }
  function startAnimation(){
    if(!reduce && !document.hidden && animationFrame===null) animationFrame=requestAnimationFrame(frame);
  }
  function stopAnimation(){
    if(animationFrame!==null){ cancelAnimationFrame(animationFrame); animationFrame=null; }
  }

  addEventListener('resize',()=>{ size(); init(); if(reduce) renderStatic(); });
  addEventListener('pointermove',e=>{ mx=e.clientX*dpr; my=e.clientY*dpr; });
  addEventListener('pointerleave',()=>{ mx=-9999; my=-9999; });
  addEventListener('pointerdown',e=>{ bursts.push({x:e.clientX*dpr,y:e.clientY*dpr,t0:performance.now()}); });
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden) stopAnimation();
    else { lastModeShift=performance.now(); startAnimation(); }
  });
  size(); init();
  if(!reduce) startAnimation(); else renderStatic();

  const hidden=document.getElementById('cmd'), cmdText=document.getElementById('cmdText'), lines=document.getElementById('lines');
  let misses=0;
  function print(text,cls='dim'){
    const row=document.createElement('div'); row.className='row '+cls; row.textContent=text; lines.appendChild(row);
    if(lines.children.length>5) lines.removeChild(lines.firstChild);
  }
  function go(url){ print('opening…','dim'); setTimeout(()=>{ location.href=url; },520); }
  function run(raw){
    const text=raw.trim(); print('> '+raw,'echo');
    if(!text) return;
    const cmd=text.toLowerCase();
    if(cmd==='clear'){ lines.innerHTML=''; misses=0; return; }
    if(cmd==='theme'){ palette=palette==='bone'?'ash':'bone'; assignColors(); print('palette: '+palette,'dim'); return; }
    const numeric=/^[1-5]$/.test(cmd) ? MODES[Number(cmd)-1] : null;
    const next=numeric || (MODES.includes(cmd) ? cmd : null);
    if(next){ setMode(next); print('field: '+next,'dim'); return; }
    if(cmd==='duckhunt'){ print('loading…','dim'); import('./duckhunt/game.mjs').then(m=>m.startDuckHunt()).catch(()=>print('duckhunt failed to load.','dim')); return; }
    if(cmd==='photos'){ go('https://photos.brunosoares.net'); return; }
    if(cmd==='meals'){ go('https://meals.brunosoares.net'); return; }
    if(cmd==='dns'){ go('http://dns.brunosoares.net'); return; }
    if(cmd==='help'){ misses++; print('there is no index.','dim'); return; }
    misses++;
    const hints=['not found.','nothing answers to that.','some doors answer to what they are.','short names open quiet rooms.'];
    print(hints[Math.min(misses-1,hints.length-1)],'dim');
  }
  hidden.addEventListener('input',()=>{ cmdText.textContent=hidden.value; });
  hidden.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const v=hidden.value; hidden.value=''; cmdText.textContent=''; run(v); } });
  document.addEventListener('click',()=>hidden.focus());
  addEventListener('load',()=>hidden.focus());
  hidden.focus();
})();
</script>
</body>
</html>
